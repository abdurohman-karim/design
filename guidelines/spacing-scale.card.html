<!-- @dsCard group="Spacing" viewport="700x170" name="Spacing scale" subtitle="8px base rhythm, generous whitespace" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--bg); padding: 28px 32px; }
  .row { display:flex; align-items:flex-end; gap:18px; }
  .col { display:flex; flex-direction:column; align-items:flex-start; gap:8px; }
  .bar { background:var(--white); height:40px; border-radius:3px; }
  .t { font-family:var(--font-mono); font-size:10px; color:var(--text-muted); }
</style>
</head>
<body>
  <div class="row">
    <div class="col"><div class="bar" style="width:4px;"></div><span class="t">1·4</span></div>
    <div class="col"><div class="bar" style="width:8px;"></div><span class="t">2·8</span></div>
    <div class="col"><div class="bar" style="width:16px;"></div><span class="t">4·16</span></div>
    <div class="col"><div class="bar" style="width:24px;"></div><span class="t">6·24</span></div>
    <div class="col"><div class="bar" style="width:32px;"></div><span class="t">8·32</span></div>
    <div class="col"><div class="bar" style="width:48px;"></div><span class="t">12·48</span></div>
    <div class="col"><div class="bar" style="width:64px;"></div><span class="t">16·64</span></div>
    <div class="col"><div class="bar" style="width:96px;"></div><span class="t">24·96</span></div>
  </div>
</body>
</html>
