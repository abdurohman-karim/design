<!-- @dsCard group="Brand" viewport="700x180" name="Logo / wordmark" subtitle="Monogram aK + lowercase wordmark, bold initials" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--bg); padding: 30px 32px; display:flex; align-items:center; gap:44px; }
  .mono { width:64px; height:64px; border:1px solid var(--border-strong); border-radius:14px; display:flex; align-items:center; justify-content:center; font-family:var(--font-display); font-weight:600; font-size:30px; letter-spacing:-0.04em; color:var(--white); box-shadow:var(--inset-hairline); }
  .word { font-family:var(--font-display); font-size:26px; font-weight:400; letter-spacing:-0.02em; color:var(--text-secondary); }
  .word b { color:var(--white); font-weight:600; }
  .lab { font-family:var(--font-mono); font-size:10px; letter-spacing:.18em; text-transform:uppercase; color:var(--text-muted); margin-top:10px; }
</style>
</head>
<body>
  <div style="text-align:center;"><div class="mono">aK</div><div class="lab">monogram</div></div>
  <div><div class="word"><b>a</b>bdurohman<b>K</b>arim</div><div class="lab">wordmark</div></div>
</body>
</html>
