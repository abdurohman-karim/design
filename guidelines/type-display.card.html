<!-- @dsCard group="Type" viewport="700x230" name="Display — Space Grotesk" subtitle="Geometric sans for hero & headings" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--bg); padding: 28px 32px; }
  .row { display: flex; align-items: baseline; gap: 16px; }
  .label { font-family: var(--font-mono); font-size: 11px; letter-spacing: .1em; color: var(--text-muted); text-transform: uppercase; min-width: 96px; }
</style>
</head>
<body>
  <div style="display:flex; flex-direction:column; gap:18px;">
    <div class="row">
      <span class="label">Hero / 88</span>
      <span style="font-family:var(--font-display); font-size:64px; font-weight:500; letter-spacing:-0.04em; line-height:1; color:var(--text-primary);">Backend</span>
    </div>
    <div class="row">
      <span class="label">Display / 48</span>
      <span style="font-family:var(--font-display); font-size:40px; font-weight:500; letter-spacing:-0.02em; color:var(--text-primary);">Fintech &amp; AI systems</span>
    </div>
    <div class="row">
      <span class="label">Heading / 28</span>
      <span style="font-family:var(--font-display); font-size:24px; font-weight:500; color:var(--text-secondary);">Payment infrastructure</span>
    </div>
  </div>
</body>
</html>
