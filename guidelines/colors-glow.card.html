<!-- @dsCard group="Colors" viewport="700x190" name="White glow & accent" subtitle="The only 'color' is white light — hover halos, no hue" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--bg); padding: 30px 32px; }
  .row { display:flex; gap:28px; align-items:center; }
  .orb { width:84px; height:84px; border-radius:50%; background:var(--white); }
  .cap { font-family:var(--font-mono); font-size:10px; color:var(--text-secondary); text-align:center; margin-top:12px; }
  .col { display:flex; flex-direction:column; align-items:center; }
</style>
</head>
<body>
  <div class="row">
    <div class="col"><div class="orb" style="box-shadow:var(--glow-halo-sm);"></div><div class="cap">glow-soft</div></div>
    <div class="col"><div class="orb" style="box-shadow:var(--glow-halo-md);"></div><div class="cap">glow-medium</div></div>
    <div class="col"><div class="orb" style="box-shadow:var(--glow-halo-lg);"></div><div class="cap">glow-large</div></div>
    <div class="col"><div style="font-family:var(--font-display); font-size:30px; font-weight:600; color:var(--white); text-shadow:var(--glow-text);">accent</div><div class="cap">glow-text</div></div>
  </div>
</body>
</html>
