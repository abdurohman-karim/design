<style>
  html { scroll-behavior: smooth; }
  body { margin: 0; background: var(--bg); }
  :root { --header-bg: rgba(0, 0, 0, 0.70); }
  [data-theme="light"] { --header-bg: rgba(255, 255, 255, 0.85); }
  [data-reveal] { opacity: 0; transform: translateY(28px); transition: opacity .8s var(--ease-out), transform .8s var(--ease-out); }
  [data-reveal].is-in { opacity: 1; transform: none; }
  @media (prefers-reduced-motion: reduce) { [data-reveal] { opacity: 1; transform: none; } }

<body>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<!-- GSAP + ScrollTrigger (used by Stack.jsx card-deck animation) -->
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js" crossorigin="anonymous"></script>

<!-- All components load once into this single shell (SPA) — absolute paths so
     they resolve correctly even when the shell is served for /interests -->
<script type="text/babel" src="/ui_kits/portfolio/Header.jsx"></script>
<script type="text/babel" src="/ui_kits/portfolio/DecryptBtn.jsx"></script>
<script type="text/babel" src="/ui_kits/portfolio/Hero.jsx"></script>
<script type="text/babel" src="/ui_kits/portfolio/About.jsx"></script>
<script type="text/babel" src="/ui_kits/portfolio/Stack.jsx"></script>
<script type="text/babel" src="/ui_kits/portfolio/Projects.jsx"></script>
<script type="text/babel" src="/ui_kits/portfolio/Repositories.jsx"></script>
<script type="text/babel" src="/ui_kits/portfolio/Contact.jsx"></script>
<script type="text/babel" src="/ui_kits/portfolio/CustomCursor.jsx"></script>
<script type="text/babel" src="/interests/InterestsPage.jsx"></script>

<script type="text/babel">
gsap.registerPlugin(ScrollTrigger);

/* Normalise any path to one of two routes */
const routeOf = (p) => (p.startsWith('/interests') ? '/interests/' : '/');

/* Retry-scroll to a hash target — sections mount after a route switch */
function scrollToHash(hash) {
  const tryIt = (n) => {
    const el = document.querySelector(hash);
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
    else if (n < 12) requestAnimationFrame(() => tryIt(n + 1));
  };
  tryIt(0);
}

/* ── Home route: hero + sections, scroll-spy + reveal ── */
function HomeRoute() {
  const [active, setActive] = React.useState('home');

  React.useEffect(() => {
    const ids = ['home', 'about', 'stack', 'projects', 'repos', 'contact'];
    const spy = new IntersectionObserver((entries) => {
      entries.forEach((e) => { if (e.isIntersecting) setActive(e.target.id); });
    }, { rootMargin: '-45% 0px -50% 0px' });
    ids.forEach((id) => { const el = document.getElementById(id); if (el) spy.observe(el); });

    const reveal = new IntersectionObserver((entries) => {
      entries.forEach((e) => { if (e.isIntersecting) { e.target.classList.add('is-in'); reveal.unobserve(e.target); } });
    }, { rootMargin: '0px 0px -10% 0px' });
    document.querySelectorAll('[data-reveal]').forEach((el) => reveal.observe(el));

    // Stack creates its ScrollTrigger on mount; refresh once layout settles
    const raf = requestAnimationFrame(() => ScrollTrigger.refresh());

    return () => { spy.disconnect(); reveal.disconnect(); cancelAnimationFrame(raf); };
  }, []);

  return (
    <>
      <Header active={active} />
      <main>
        <Hero />
        <div data-reveal><About /></div>
        <Stack />
        <div data-reveal><Projects /></div>
        <div data-reveal><Repositories /></div>
        <div data-reveal><Contact /></div>
      </main>
    </>
  );
}

/* ── Interests route ── */
function InterestsRoute() {
  return (
    <>
      <Header active="interests" />
      <InterestsPage />
    </>
  );
}

/* ── Client-side router (History API) ── */
function App() {
  const [route, setRoute] = React.useState(() => routeOf(window.location.pathname));
  const pendingScroll = React.useRef(null);

  /* Intercept internal link clicks → pushState instead of full navigation */
  React.useEffect(() => {
    const onClick = (e) => {
      if (e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
      const a = e.target.closest('a');
      if (!a || (a.target && a.target !== '_self') || a.hasAttribute('download')) return;
      const href = a.getAttribute('href');
      if (!href) return;
      const url = new URL(a.href, window.location.href);
      if (url.origin !== window.location.origin) return;            // external
      const p = url.pathname;
      if (p !== '/' && p !== '/interests' && p !== '/interests/') return; // not routable → let browser handle
      e.preventDefault();

      const target = routeOf(p);
      const full = p + url.hash;
      if (target !== route) {
        window.history.pushState({}, '', full);
        pendingScroll.current = url.hash || 'top';
        setRoute(target);
      } else {
        window.history.pushState({}, '', full);
        if (url.hash) scrollToHash(url.hash);
        else window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    };
    document.addEventListener('click', onClick);
    return () => document.removeEventListener('click', onClick);
  }, [route]);

  /* Back / forward */
  React.useEffect(() => {
    const onPop = () => {
      pendingScroll.current = window.location.hash || 'top';
      setRoute(routeOf(window.location.pathname));
    };
    window.addEventListener('popstate', onPop);
    return () => window.removeEventListener('popstate', onPop);
  }, []);

  /* After a route change, consume the pending scroll intent */
  React.useEffect(() => {
    const s = pendingScroll.current;
    pendingScroll.current = null;
    if (s === 'top') window.scrollTo(0, 0);
    else if (s) scrollToHash(s);
  }, [route]);

  return (
    <>
      <CustomCursor />
      {route === '/interests/' ? <InterestsRoute /> : <HomeRoute />}
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
