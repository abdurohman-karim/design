<style>
  html { scroll-behavior: smooth; }
  body { margin: 0; background: var(--bg); }
  :root { --header-bg: rgba(0, 0, 0, 0.70); }
  [data-theme="light"] { --header-bg: rgba(255, 255, 255, 0.85); }
  [data-reveal] { opacity: 0; transform: translateY(28px); transition: opacity .8s var(--ease-out), transform .8s var(--ease-out); }
  [data-reveal].is-in { opacity: 1; transform: none; }
  @media (prefers-reduced-motion: reduce) { [data-reveal] { opacity: 1; transform: none; } }
  @media (max-width: 720px) { .ak-nav { display: none !important; } }

  /* ── Preloader — instant inline overlay, fades out once React mounts ── */
  #ak-preloader {
    position: fixed; inset: 0; z-index: 99990;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 26px;
    background: var(--bg, #000);
    transition: opacity .6s var(--ease-out, cubic-bezier(.16,1,.3,1));
  }
  #ak-preloader.is-done { opacity: 0; pointer-events: none; }
  #ak-preloader::before {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse 60% 50% at 50% 46%, rgba(255,255,255,0.06), transparent 70%);
  }
  .ak-pre-mark {
    width: 64px; height: 64px; display: grid; place-items: center;
    border: 1px solid var(--border-strong, rgba(255,255,255,.18)); border-radius: 14px;
    font-family: var(--font-display, system-ui, sans-serif); font-weight: 600; font-size: 26px;
    letter-spacing: -0.04em; color: var(--white, #fff);
    box-shadow: var(--inset-hairline, inset 0 1px 0 rgba(255,255,255,.08));
    animation: ak-pre-breath 1.8s var(--ease-in-out, ease-in-out) infinite;
  }
  @keyframes ak-pre-breath {
    0%, 100% { box-shadow: var(--inset-hairline, inset 0 1px 0 rgba(255,255,255,.08)), 0 0 0 rgba(255,255,255,0); }
    50%      { box-shadow: var(--inset-hairline, inset 0 1px 0 rgba(255,255,255,.08)), 0 0 34px rgba(255,255,255,.16); }
  }
  .ak-pre-track {
    position: relative; width: 180px; height: 2px; border-radius: 2px; overflow: hidden;
    background: var(--border, rgba(255,255,255,.08));
  }
  .ak-pre-fill {
    position: absolute; inset: 0; transform: scaleX(0); transform-origin: left center;
    background: var(--white, #fff);
  }
  .ak-pre-count {
    font-family: var(--font-mono, ui-monospace, monospace); font-size: 11px;
    letter-spacing: .24em; color: var(--text-muted, #6b6b6b);
  }
  /* ── Boot-sequence log — fixed height so lines never shift the layout ── */
  .ak-pre-log {
    width: 300px; max-width: 82vw; height: 108px; /* 6 lines × 18px */
    overflow: hidden; text-align: left;
    font-family: var(--font-mono, ui-monospace, monospace);
    font-size: 11px; line-height: 18px; letter-spacing: .04em;
    color: var(--text-faint, #555555);
  }
  /* Status tokens differ by luminance only — no hue */
  .ak-pre-log b { font-weight: 400; color: var(--gray-300, #A0A0A0); }
  .ak-pre-log .ak-pre-line-done b { color: var(--white, #FFFFFF); }
  @media (prefers-reduced-motion: reduce) { .ak-pre-mark { animation: none; } }
</style>

<!-- Preloader driver — runs immediately, before React/Babel even download -->
<script>
(function () {
  var fill  = document.getElementById('ak-pre-fill');
  var count = document.getElementById('ak-pre-count');
  var pre   = document.getElementById('ak-preloader');
  var p = 0, done = false, raf;
  document.body.style.overflow = 'hidden';

  function render() {
    if (fill)  fill.style.transform = 'scaleX(' + p.toFixed(3) + ')';
    if (count) count.textContent = String(Math.round(p * 100)).padStart(3, '0');
  }
  function tick() {
    if (done) return;
    p += (0.9 - p) * 0.025;          // ease toward 90% while the app boots
    if (p > 0.899) p = 0.899;
    render();
    raf = requestAnimationFrame(tick);
  }
  raf = requestAnimationFrame(tick);

  window.__akReady = function () {
    if (done) return;
    done = true;
    cancelAnimationFrame(raf);
    var start = p, t0 = performance.now();
    (function finish(now) {
      var k = Math.min(1, (now - t0) / 300);
      p = start + (1 - start) * k;    // snap to 100%
      render();
      if (k < 1) { requestAnimationFrame(finish); return; }
      if (pre) {
        pre.classList.add('is-done');
        setTimeout(function () {
          if (pre && pre.parentNode) pre.parentNode.removeChild(pre);
          document.body.style.overflow = '';
        }, 650);
      }
    })(t0);
  };

  // Safety net: never trap the user if the app fails to signal
  setTimeout(function () { if (!done) window.__akReady(); }, 8000);

  /* ── Boot-sequence log (additive) ─────────────────────────────────────
     Types kernel-style lines while the fake progress runs. __akReady is
     wrapped (original untouched) to flush remaining lines and print the
     final one; the 8s safety net calls the wrapper too, so a CDN failure
     still completes the log and releases the preloader. */
  var bootEl = document.getElementById('ak-pre-log');
  if (bootEl) {
    var BOOT = [
      ['[ 0.001s]', ' booting synetra …'],
      ['[  ok  ]',  ' mounting /portfolio'],
      ['[  ok  ]',  ' connecting redis'],
      ['[  ok  ]',  ' warming cache'],
      ['[  ok  ]',  ' loading modules'],
    ];
    var bi = 0, bt = null, bootFlushed = false;
    var bootReduced = window.matchMedia &&
      window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    var addBootLine = function (status, text, cls) {
      var d = document.createElement('div');
      if (cls) d.className = cls;
      var b = document.createElement('b');
      b.textContent = status;
      d.appendChild(b);
      d.appendChild(document.createTextNode(text));
      bootEl.appendChild(d);
    };
    var nextBootLine = function () {
      if (bi >= BOOT.length) return;
      addBootLine(BOOT[bi][0], BOOT[bi][1]);
      bi++;
      bt = setTimeout(nextBootLine, 170 + Math.random() * 160);
    };
    var flushBoot = function () {
      if (bootFlushed) return;
      bootFlushed = true;
      if (bt) clearTimeout(bt);
      while (bi < BOOT.length) { addBootLine(BOOT[bi][0], BOOT[bi][1]); bi++; }
      addBootLine('[ done ]', ' system ready', 'ak-pre-line-done');
    };

    if (bootReduced) {
      while (bi < BOOT.length) { addBootLine(BOOT[bi][0], BOOT[bi][1]); bi++; }
    } else {
      bt = setTimeout(nextBootLine, 120);
    }

    var origReady = window.__akReady;
    window.__akReady = function () { flushBoot(); origReady(); };
  }
})();
</script>

<script type="text/babel">
gsap.registerPlugin(ScrollTrigger);

/* Normalise any path to one of two routes */
const routeOf = (p) => (p.startsWith('/interests') ? '/interests/' : '/');

/* Retry-scroll to a hash target — sections mount after a route switch */
function scrollToHash(hash) {
  const tryIt = (n) => {
    const el = document.querySelector(hash);
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
    else if (n < 12) requestAnimationFrame(() => tryIt(n + 1));
  };
  tryIt(0);
}

/* ── Home route: hero + sections, scroll-spy + reveal ── */
function HomeRoute() {
  const [active, setActive] = React.useState('home');

  React.useEffect(() => {
    const ids = ['home', 'about', 'stack', 'projects', 'repos', 'contact'];
    const spy = new IntersectionObserver((entries) => {
      entries.forEach((e) => { if (e.isIntersecting) setActive(e.target.id); });
    }, { rootMargin: '-45% 0px -50% 0px' });
    ids.forEach((id) => { const el = document.getElementById(id); if (el) spy.observe(el); });

    const reveal = new IntersectionObserver((entries) => {
      entries.forEach((e) => { if (e.isIntersecting) { e.target.classList.add('is-in'); reveal.unobserve(e.target); } });
    }, { rootMargin: '0px 0px -10% 0px' });
    document.querySelectorAll('[data-reveal]').forEach((el) => reveal.observe(el));

    // Stack creates its ScrollTrigger on mount; refresh once layout settles
    const raf = requestAnimationFrame(() => ScrollTrigger.refresh());

    return () => { spy.disconnect(); reveal.disconnect(); cancelAnimationFrame(raf); };
  }, []);

  return (
    <>
      <Header active={active} />
      <main>
        <Hero />
        <div data-reveal><About /></div>
        <Stack />
        <div data-reveal><Projects /></div>
        <div data-reveal><Repositories /></div>
        <div data-reveal><Contact /></div>
      </main>
    </>
  );
}

/* ── Interests route ── */
function InterestsRoute() {
  return (
    <>
      <Header active="interests" />
      <InterestsPage />
    </>
  );
}

/* ── Client-side router (History API) ── */
function App() {
  const [route, setRoute] = React.useState(() => routeOf(window.location.pathname));
  const pendingScroll = React.useRef(null);

  /* App is mounted and painted — dismiss the preloader */
  React.useEffect(() => {
    if (window.__akReady) requestAnimationFrame(() => window.__akReady());
  }, []);

  /* Intercept internal link clicks → pushState instead of full navigation */
  React.useEffect(() => {
    const onClick = (e) => {
      if (e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
      const a = e.target.closest('a');
      if (!a || (a.target && a.target !== '_self') || a.hasAttribute('download')) return;
      const href = a.getAttribute('href');
      if (!href) return;
      const url = new URL(a.href, window.location.href);
      if (url.origin !== window.location.origin) return;            // external
      const p = url.pathname;
      if (p !== '/' && p !== '/interests' && p !== '/interests/') return; // not routable → let browser handle
      e.preventDefault();

      const target = routeOf(p);
      const full = p + url.hash;
      if (target !== route) {
        window.history.pushState({}, '', full);
        pendingScroll.current = url.hash || 'top';
        setRoute(target);
      } else {
        window.history.pushState({}, '', full);
        if (url.hash) scrollToHash(url.hash);
        else window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    };
    document.addEventListener('click', onClick);
    return () => document.removeEventListener('click', onClick);
  }, [route]);

  /* Back / forward */
  React.useEffect(() => {
    const onPop = () => {
      pendingScroll.current = window.location.hash || 'top';
      setRoute(routeOf(window.location.pathname));
    };
    window.addEventListener('popstate', onPop);
    return () => window.removeEventListener('popstate', onPop);
  }, []);

  /* After a route change, consume the pending scroll intent */
  React.useEffect(() => {
    const s = pendingScroll.current;
    pendingScroll.current = null;
    if (s === 'top') window.scrollTo(0, 0);
    else if (s) scrollToHash(s);
  }, [route]);

  return (
    <>
      {/* Mounted before the routes so section content (equal z) paints above it */}
      <LedgerBackground />
      <CustomCursor />
      <CommandTerminal />
      <DecryptHeadings />
      {route === '/interests/' ? <InterestsRoute /> : <HomeRoute />}
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
