<!DOCTYPE html>

<body class="ak-grid-bg">
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
const { Button, Tag, Badge, Icon } = window.AbdurohmanKarimPortfolioDesignSystem_bf6e8b;
const G = ({label, children}) => (
  <div className="grp"><div className="gl">{label}</div><div className="row">{children}</div></div>
);
function Demo(){
  return (<>
    <G label="Button — variants">
      <Button variant="primary" arrow>Apply</Button>
      <Button variant="secondary" arrow>View work</Button>
      <Button variant="outline">Resume</Button>
      <Button variant="ghost">Skip</Button>
      <Button variant="primary" disabled>Disabled</Button>
    </G>
    <G label="Button — sizes">
      <Button size="sm">Small</Button>
      <Button size="md">Medium</Button>
      <Button size="lg" arrow>Large</Button>
    </G>
    <G label="Tag">
      <Tag active>PHP</Tag><Tag>Laravel</Tag><Tag>Python</Tag><Tag>PostgreSQL</Tag><Tag>Redis</Tag><Tag>Docker</Tag>
    </G>
    <G label="Badge">
      <Badge dot>Available for work</Badge><Badge variant="outline">2025</Badge><Badge variant="solid">Fintech</Badge>
    </G>
    <G label="Icon">
      {['cube','branch','server','database','terminal','shield','bot','send','github','mail','arrowUpRight'].map(n=>(
        <span key={n} style={{color:'var(--text-secondary)'}}><Icon name={n} duotone /></span>
      ))}
    </G>
  </>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script>
